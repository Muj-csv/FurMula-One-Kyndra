<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches the light page ground. Updated at runtime when the theme is
         toggled — see App.tsx. It was #1b3a2f, a dark green left over from
         before the Terracotta/Olive palette, so the browser chrome on mobile
         did not match any colour on the page. -->
    <meta name="theme-color" content="#f8f3e8" />
    <meta
      name="description"
      content="Kyndra — where the right homes meet the right animals. Transparent, explainable adoption matching for shelters."
    />
    <!-- Webfonts, loaded here rather than from an @import inside index.css.
         ==================================================================
         An @import is the slowest way to load a font: the browser must fetch
         and parse the stylesheet, discover the @import, fetch THAT
         stylesheet, and only then start on the font files — three
         round-trips before a single character can render in its real face.
         A <link> here starts the chain during HTML parse, and preconnect
         warms the two hosts while that is happening.

         Two families, on purpose: Fraunces carries headlines and large
         numbers, Plus Jakarta Sans carries everything that is read rather
         than scanned. One face doing every job was the single most
         recognisable "generated site" signature on the page.

         Fraunces is requested as a weight RANGE (600..700), not a single
         instance. Pinned at 600 it looked right in a screenshot and was
         quietly wrong: headings ask for 700, only 600 was loaded, and the
         browser was FAUX-BOLDING the serif — synthetic thickening, which
         smears an old-style face at display size. A variable range costs the
         same one file and makes every weight the page asks for a real one.

         The weight list is deliberately short. Plus Jakarta Sans previously
         loaded 400/500/600/700/800 plus a 600 italic — six files, when 500
         appeared twice in the whole stylesheet, 800 four times, and body
         italics were being SYNTHESISED because the only italic loaded was a
         weight nothing used. It is now 400/600/700 plus a real 400 italic,
         and Fraunces adds one variable file. Five files, down from six. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Kyndra — Where the right homes meet the right animals</title>

    <!-- Theme bootstrap. Must run here, and must not be a module.
         ==================================================================
         The theme lives on a `data-theme` attribute (src/index.css), and the
         choice is remembered in localStorage. If React applied it, the first
         paint would use the default palette and then repaint — a white flash
         on every single load for anyone who has chosen dark. A module script
         is deferred by definition, so it would flash too.

         So: inline, synchronous, before the body exists. It is the only
         script in this document for exactly that reason.

         LIGHT IS THE DEFAULT. Nothing here reads prefers-color-scheme;
         absent a stored choice, the answer is light. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          if (localStorage.getItem('kyndra-theme') === 'dark') theme = 'dark';
        } catch (e) {
          /* Storage can throw outright in private mode or when site data is
             blocked. A remembered preference is a convenience; failing to
             read one must never stop the page rendering. */
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
